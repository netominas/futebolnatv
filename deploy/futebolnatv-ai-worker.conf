[program:futebolnatv-ai-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/nice -n 10 /usr/bin/php /var/www/futebolnatv/artisan queue:work redis_ai --queue=ai --sleep=2 --tries=2 --timeout=300 --max-time=3600
directory=/var/www/futebolnatv
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/futebolnatv/storage/logs/ai-worker.log
stopwaitsecs=330
